    <!-- Firebase SDK (v11.6.1) -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { 
            getAuth, 
            signInAnonymously, 
            signInWithCustomToken, 
            onAuthStateChanged 
        } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { 
            getFirestore, 
            collection, 
            doc, 
            addDoc, 
            updateDoc, 
            onSnapshot, 
            serverTimestamp 
        } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        // 全域變數初始化
        window.db = null;
        window.auth = null;
        window.currentUser = null;
        window.isCloudConnected = false;

        // 全域函數定義，以便傳統 JS 調用
        window.addDocFS = addDoc;
        window.updateDocFS = updateDoc;
        window.docFS = doc;
        window.collectionFS = collection;

        // Firebase 初始化邏輯
        async function initFirebase() {
            try {
                // 優先檢查是否有來自環境的 Firebase 設定，否則回退至示範模式或使用者自訂
                const defaultAppId = typeof __app_id !== 'undefined' ? __app_id : 'echo-haven-demo';
                window.appId = defaultAppId;

                let firebaseConfig = null;
                const userConfigStr = localStorage.getItem('custom_firebase_config');

                if (userConfigStr) {
                    try { firebaseConfig = JSON.parse(userConfigStr); } catch(e){}
                }

                if (!firebaseConfig && typeof __firebase_config !== 'undefined') {
                    try { firebaseConfig = JSON.parse(__firebase_config); } catch(e){}
                }

                // 備用示範設定 (當無傳入設定時維持前端畫面可運作)
                if (!firebaseConfig) {
                    console.log("未檢測到 Firebase 憑證，將開啟即時資料庫模式");
                    updateStatusIndicator(false, "尚未連接自訂 Firebase (使用本機即時模式)");
                    window.initLocalFallback();
                    return;
                }

                const app = initializeApp(firebaseConfig);
                window.db = getFirestore(app);
                window.auth = getAuth(app);

                // 驗證流程
                if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
                    await signInWithCustomToken(window.auth, __initial_auth_token);
                } else {
                    await signInAnonymously(window.auth);
                }

                onAuthStateChanged(window.auth, (user) => {
                    if (user) {
                        window.currentUser = user;
                        window.isCloudConnected = true;
                        updateStatusIndicator(true, "雲端資料庫已連線 (即時同步中)");
                        listenToPostsRealtime();
                    }
                });

            } catch (error) {
                console.error("Firebase 初始化失敗:", error);
                updateStatusIndicator(false, "雲端連線失敗，自動切換至本機模式");
                window.initLocalFallback();
            }
        }

        function updateStatusIndicator(isConnected, text) {
            const badge = document.getElementById('cloud-status-badge');
            const statusText = document.getElementById('cloud-status-text');
            if (badge && statusText) {
                statusText.textContent = text;
                if (isConnected) {
                    badge.className = "w-2.5 h-2.5 rounded-full bg-emerald-500 animate-pulse";
                } else {
                    badge.className = "w-2.5 h-2.5 rounded-full bg-amber-500";
                }
            }
        }

        // 監聽 Firebase Firestore 文章即時變化
        function listenToPostsRealtime() {
            if (!window.db || !window.currentUser) return;

            // 遵守 Rule 1: /artifacts/{appId}/public/data/posts
            const postsCollection = collection(window.db, 'artifacts', window.appId, 'public', 'data', 'posts');

            onSnapshot(postsCollection, (snapshot) => {
                const fetchedPosts = [];
                snapshot.forEach((docSnap) => {
                    const data = docSnap.data();
                    fetchedPosts.push({
                        id: docSnap.id,
                        ...data,
                        createdAtTime: data.createdAt ? (data.createdAt.seconds ? data.createdAt.seconds * 1000 : Date.now()) : Date.now()
                    });
                });

                // JavaScript 記憶體排序 (遵守 Rule 2)
                fetchedPosts.sort((a, b) => b.createdAtTime - a.createdAtTime);

                window.posts = fetchedPosts;
                window.renderPosts();
            }, (error) => {
                console.error("Firestore 即時監聽失敗:", error);
            });
        }

        window.initFirebase = initFirebase;
        window.addEventListener('DOMContentLoaded', initFirebase);
    </script>
